<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formStyles.css">
</head>

<body>
    <h1>Resume Form</h1>
    <form>

        <h2><b>Personal Details</b></h2>
        <hr style="margin-bottom: 20px;">
        <div class="form-group">
            <label class="label" for="name">Name:</label>
            <input class="input" type="text" id="name" autocomplete="off">
        </div>

        <div class="form-group">
            <label class="label" for="degn">Designation:</label>
            <input class="input" type="text" id="degn" autocomplete="off">
        </div>
        <div class="form-group">
            <label class="label" for="phone">Phone:</label>
            <input class="input" type="text" id="phone" autocomplete="off">
        </div>

        <div class="form-group">
            <label class="label" for="email">Email:</label>
            <input class="input" type="text" id="email" autocomplete="off">
        </div>
        <div class="form-group">
            <label class="label" for="add">Address:</label>
            <input class="input" type="text" id="add" autocomplete="off">
        </div>
        <div class="form-group">

            <h2>Education</h2>
            <hr style="margin-bottom: 20px;">
            <div class="form-group">
                <label class="label" for="pass">Passing year:</label>
                <input class="input" type="date" id="pass" autocomplete="off">
            </div>

            <div class="form-group">

                <label class="label" for="deg">Degree:</label>
                <input class="input" type="" id="deg" autocomplete="off">
            </div>


            <div class="form-group">

                <label class="label" for="uni">Institude:</label>
                <input class="input" type="" id="uni" autocomplete="off">
            </div>


            <div class="form-group">
                <label class="label" for="pass1">Passing year:</label>
                <input class="input" type="date" id="pass1" autocomplete="off">
            </div>

            <div class="form-group">

                <label class="label" for="deg1">Degree:</label>
                <input class="input" type="" id="deg1" autocomplete="off">
            </div>


            <div class="form-group">

                <label class="label" for="uni1">Institude:</label>
                <input class="input" type="" id="uni1" autocomplete="off">
            </div>
        </div>

        <h2>Expertise</h2>
        <hr style="margin-bottom: 20px;">
        <div class="form-group">

            <label class="label" for="skill">Skill:</label>
            <input class="input mb-20" type="" id="skill1" autocomplete="off">
            <label class="label" for="skill">Skill:</label>
            <input class="input mb-20" type="" id="skill2" autocomplete="off">
            <label class="label" for="skill">Skill:</label>
            <input class="input mb-20" type="" id="skill3" autocomplete="off">
        </div>

        <h2>Language</h2>
        <hr style="margin-bottom: 20px;">
        <div class="form-group">
            <label class="label" for="lang">Language1:</label>
            <input class="input mb-20" type="" id="lang" autocomplete="off">
            <label class="label" for="lang2">Language2:</label>
            <input class="input mb-20" type="" id="lang2" autocomplete="off">



            <h2>Experience</h2>
            <hr style="margin-bottom: 20px;">
            <div class="form-group">
                <label class="label" for="lang">Start year:</label>
                <input class="input mb-20" type="date" id="styear" autocomplete="off">

                <label class="label" for="lang">End year:</label>
                <input class="input mb-20" type="date" id="endyear" autocomplete="off">

                <label class="label" for="comp">Company:</label>
                <input class="input mb-20" type="text" id="comp" autocomplete="off">


                <label class="label" for="location">Company Location:</label>
                <input class="input mb-20" type="text" id="location" autocomplete="off">

                <label class="label" for="job">Job Title:</label>
                <input class="input mb-20" type="text" id="job" autocomplete="off">


                <label class="label" for="achive">Achivements:</label>
                <input class="input mb-20" type="text" id="achive1" autocomplete="off">
                <input class="input mb-20" type="text" id="achive2" autocomplete="off">
                <input class="input mb-20" type="text" id="achive3" autocomplete="off">
            </div>
            <br>
            <hr style="margin-bottom: 20px;">
            <div class="btnDiv"><input class="submit" type="submit"></div>
    </form>
    <script src="formScript.js"></script>
</body>

</html>
